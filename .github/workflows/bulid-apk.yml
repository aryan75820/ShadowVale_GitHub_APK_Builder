name: Build Shadow Vale Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Clean index.html, Inject Mobile Auto-Fit & Generate Android Project
        run: |
          mkdir -p android_build/app/src/main/assets
          mkdir -p android_build/app/src/main/java/com/pawarjigaming/shadowvale
          mkdir -p android_build/app/src/main/res/layout
          mkdir -p android_build/app/src/main/res/values

          # Locate HTML file in repo
          if [ -f "index.html" ]; then
            SRC_HTML="index.html"
          elif [ -f "shadowblade_android_rpg.html" ]; then
            SRC_HTML="shadowblade_android_rpg.html"
          elif [ -f "app/src/main/assets/index.html" ]; then
            SRC_HTML="app/src/main/assets/index.html"
          else
            SRC_HTML=$(find . -maxdepth 3 -name "*.html" | head -n 1)
          fi

          if [ -z "$SRC_HTML" ]; then
            echo "ERROR: Repo mein koi .html file nahi mili!"
            exit 1
          fi

          # Auto-clean duplicate/triple pasted HTML & inject Mobile Display Auto-Fit Patch
          python3 - "$SRC_HTML" "android_build/app/src/main/assets/index.html" << 'PYEOF'
          import sys

          src_path, dst_path = sys.argv[1], sys.argv[2]
          with open(src_path, 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          # If HTML was pasted 2 or 3 times back-to-back, keep only the first complete copy
          lower = content.lower()
          end_idx = lower.find('</html>')
          if end_idx != -1:
              content = content[:end_idx + 7]

          mobile_patch = """
          <style>
            html, body {
              width: 100dvw !important;
              height: 100dvh !important;
              overflow: hidden !important;
              position: fixed !important;
              inset: 0 !important;
            }
            .screen-layer {
              width: 100dvw !important;
              height: 100dvh !important;
              padding: 6px 10px !important;
            }
            @media (max-height: 500px) {
              #screen-splash-intro { padding: 8px 12px !important; }
              #pawarSplashCenterCard { padding: 8px 14px !important; max-height: 78dvh !important; transform: scale(0.80) !important; }
              #pawarSplashCenterCard .w-24 { width: 44px !important; height: 44px !important; margin-bottom: 4px !important; }
              #pawarSplashCenterCard h1 { font-size: 1.4rem !important; }
              #btnTapToOpenGame { padding: 6px 14px !important; font-size: 0.75rem !important; }
              #screen-main-menu { padding: 6px 12px 34px 12px !important; }
              #screen-main-menu h1 { font-size: 1.65rem !important; }
              #screen-main-menu h2 { font-size: 0.85rem !important; margin-bottom: 4px !important; }
              #screen-main-menu .menu-btn, #screen-main-menu .crimson-btn { padding: 5px 12px !important; font-size: 0.72rem !important; }
              #popup-level-complete > div, #popup-pause > div, #popup-gameover > div, #popup-confirm > div {
                max-height: 92dvh !important; overflow-y: auto !important; padding: 10px 14px !important;
              }
              :root { --hud-scale: 0.74 !important; --btn-scale: 0.80 !important; --joy-scale: 0.80 !important; }
            }
            @media (max-width: 640px) {
              :root { --hud-scale: 0.68 !important; --btn-scale: 0.76 !important; --joy-scale: 0.76 !important; }
              #screen-gameplay > div.origin-top { top: 52px !important; }
              #pawarSplashCenterCard { padding: 14px 12px !important; width: 95% !important; }
              #pawarSplashCenterCard h1 { font-size: 1.6rem !important; }
            }
          </style>
          <script>
            (function() {
              function fitMobileScreen() {
                var vw = window.innerWidth, vh = window.innerHeight, isPortrait = vh > vw;
                var joyWrap = document.getElementById('touchJoystickWrapper');
                if (joyWrap) {
                  joyWrap.style.left = '14px';
                  joyWrap.style.bottom = isPortrait ? '20px' : '12px';
                }
                var layout = isPortrait ? {
                  btnAttack:  { right: '12px', bottom: '18px' },
                  btnJump:    { right: '86px', bottom: '16px' },
                  btnDash:    { right: '148px', bottom: '18px' },
                  btnThrow:   { right: '14px', bottom: '92px' },
                  btnSpecial: { right: '80px', bottom: '82px' },
                  btnPotion:  { right: '144px', bottom: '82px' }
                } : {
                  btnAttack:  { right: '16px', bottom: '14px' },
                  btnJump:    { right: '96px', bottom: '14px' },
                  btnDash:    { right: '162px', bottom: '16px' },
                  btnThrow:   { right: '18px', bottom: '92px' },
                  btnSpecial: { right: '86px', bottom: '82px' },
                  btnPotion:  { right: '154px', bottom: '82px' }
                };
                Object.keys(layout).forEach(function(id) {
                  var el = document.getElementById(id);
                  if (el) {
                    el.style.left = 'auto';
                    el.style.right = layout[id].right;
                    el.style.bottom = layout[id].bottom;
                    el.style.transformOrigin = 'bottom right';
                  }
                });
                if (typeof canvas !== 'undefined' && canvas) {
                  var targetW = isPortrait ? 660 : 860;
                  if (vw < targetW) {
                    var ratio = targetW / vw;
                    cw = Math.round(vw * ratio);
                    ch = Math.round(vh * ratio);
                    canvas.width = cw;
                    canvas.height = ch;
                    groundY = Math.floor(ch * (isPortrait ? 0.72 : 0.79));
                    if (typeof rebuildPlatforms === 'function') rebuildPlatforms();
                    if (typeof player !== 'undefined' && player.onGround) player.y = groundY;
                  }
                }
              }
              window.addEventListener('resize', fitMobileScreen);
              window.addEventListener('orientationchange', function() { setTimeout(fitMobileScreen, 120); });
              window.addEventListener('load', function() {
                setTimeout(fitMobileScreen, 50);
                var origApply = window.applySettingsAndControlsToDOM;
                if (typeof origApply === 'function') {
                  window.applySettingsAndControlsToDOM = function() { origApply(); fitMobileScreen(); };
                }
                var origResize = window.resizeCanvas;
                if (typeof origResize === 'function') {
                  window.resizeCanvas = function() { origResize(); fitMobileScreen(); };
                }
                fitMobileScreen();
              });
            })();
          </script>
          """

          if '</body>' in content:
              content = content.replace('</body>', mobile_patch + '\n</body>', 1)
          else:
              content += mobile_patch

          with open(dst_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print("Successfully cleaned and patched index.html for mobile display!")
          PYEOF

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShadowValeEmberQuest"
          include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > android_build/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.pawarjigaming.shadowvale'
              compileSdk 34
              defaultConfig {
                  applicationId "com.pawarjigaming.shadowvale"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.pawarjigaming.shadowvale">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Shadow Vale: Ember Quest"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-8251220250880290~5084634199"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:ads="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#05070e">
              <WebView
                  android:id="@+id/gameWebView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
              <com.google.android.gms.ads.AdView
                  android:id="@+id/adViewBanner"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:layout_centerHorizontal="true"
                  ads:adSize="BANNER"
                  ads:adUnitId="ca-app-pub-8251220250880290/8023542749" />
          </RelativeLayout>
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/pawarjigaming/shadowvale/MainActivity.java
          package com.pawarjigaming.shadowvale;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;

          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private AdView bannerAdView;
              private InterstitialAd mInterstitialAd;
              private RewardedAd mRewardedAd;

              private static final String INTERSTITIAL_UNIT_ID = "ca-app-pub-8251220250880290/9714319357";
              private static final String REWARDED_UNIT_ID = "ca-app-pub-8251220250880290/8215114432";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  hideSystemUI();
                  setContentView(R.layout.activity_main);

                  MobileAds.initialize(this, initializationStatus -> {});

                  bannerAdView = findViewById(R.id.adViewBanner);
                  bannerAdView.loadAd(new AdRequest.Builder().build());

                  loadInterstitial();
                  loadRewarded();

                  webView = findViewById(R.id.gameWebView);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setTextZoom(100);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new AdMobBridge(), "AndroidAdMob");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              private void loadInterstitial() {
                  InterstitialAd.load(this, INTERSTITIAL_UNIT_ID, new AdRequest.Builder().build(),
                      new InterstitialAdLoadCallback() {
                          @Override
                          public void onAdLoaded(@NonNull InterstitialAd ad) { mInterstitialAd = ad; }
                          @Override
                          public void onAdFailedToLoad(@NonNull LoadAdError adError) { mInterstitialAd = null; }
                      });
              }

              private void loadRewarded() {
                  RewardedAd.load(this, REWARDED_UNIT_ID, new AdRequest.Builder().build(),
                      new RewardedAdLoadCallback() {
                          @Override
                          public void onAdLoaded(@NonNull RewardedAd ad) { mRewardedAd = ad; }
                          @Override
                          public void onAdFailedToLoad(@NonNull LoadAdError adError) { mRewardedAd = null; }
                      });
              }

              public class AdMobBridge {
                  @JavascriptInterface
                  public void initialize(String bannerId, String interId, String rewardId) {}

                  @JavascriptInterface
                  public void setBannerVisible(boolean visible, String bannerId) {
                      runOnUiThread(() -> bannerAdView.setVisibility(visible ? View.VISIBLE : View.GONE));
                  }

                  @JavascriptInterface
                  public void showInterstitial(String unitId) {
                      runOnUiThread(() -> {
                          if (mInterstitialAd != null) {
                              mInterstitialAd.setFullScreenContentCallback(new FullScreenContentCallback() {
                                  @Override
                                  public void onAdDismissedFullScreenContent() {
                                      mInterstitialAd = null;
                                      loadInterstitial();
                                      webView.evaluateJavascript("if(window.onAdMobInterstitialClosed) window.onAdMobInterstitialClosed();", null);
                                  }
                                  @Override
                                  public void onAdFailedToShowFullScreenContent(@NonNull AdError adError) {
                                      webView.evaluateJavascript("if(window.onAdMobInterstitialClosed) window.onAdMobInterstitialClosed();", null);
                                  }
                              });
                              mInterstitialAd.show(MainActivity.this);
                          } else {
                              loadInterstitial();
                              webView.evaluateJavascript("if(window.onAdMobInterstitialClosed) window.onAdMobInterstitialClosed();", null);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showRewarded(String unitId) {
                      runOnUiThread(() -> {
                          if (mRewardedAd != null) {
                              mRewardedAd.show(MainActivity.this, rewardItem -> {
                                  mRewardedAd = null;
                                  loadRewarded();
                                  webView.evaluateJavascript("if(window.onAdMobRewardGranted) window.onAdMobRewardGranted();", null);
                              });
                          } else {
                              loadRewarded();
                              webView.evaluateJavascript("if(window.onAdMobRewardGranted) window.onAdMobRewardGranted();", null);
                          }
                      });
                  }
              }
          }
          EOF

      - name: 4
