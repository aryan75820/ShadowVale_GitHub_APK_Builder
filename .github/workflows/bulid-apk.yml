name: Build Shadow Vale Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Extract ZIP, Generate Android Project and Build APK
        run: |
          cat << 'EOF' > make_project.py
          import os, glob, shutil, zipfile

          # 1. Unzip ShadowVale-EmberQuest-Android-APK.zip (or any .zip in repo)
          for z in glob.glob("*.zip"):
              print("Extracting ZIP:", z)
              with zipfile.ZipFile(z, "r") as zf:
                  zf.extractall("unzipped_game")

          # 2. Setup Android project folders
          base = "android_project/app/src/main"
          pkg_dir = f"{base}/java/com/pawarjigaming/shadowvale"
          os.makedirs(f"{base}/assets", exist_ok=True)
          os.makedirs(pkg_dir, exist_ok=True)

          # 3. Find the largest .html game file (from zip or root)
          htmls = [f for f in glob.glob("**/*.html", recursive=True) if not f.startswith("android_project")]
          if not htmls:
              raise RuntimeError("ZIP ya repo ke andar koi .html file nahi mili!")
          htmls.sort(key=lambda x: os.path.getsize(x), reverse=True)
          print("Using Game HTML file:", htmls[0])
          shutil.copyfile(htmls[0], f"{base}/assets/index.html")

          open("android_project/settings.gradle", "w").write("""pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ShadowValeEmberQuest"
          include ":app"
          """)

          open("android_project/build.gradle", "w").write("""plugins {
              id "com.android.application" version "8.2.2" apply false
          }
          """)

          open("android_project/gradle.properties", "w").write("""org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """)

          open("android_project/app/build.gradle", "w").write("""plugins {
              id "com.android.application"
          }
          android {
              namespace "com.pawarjigaming.shadowvale"
              compileSdk 34
              defaultConfig {
                  applicationId "com.pawarjigaming.shadowvale"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.google.android.gms:play-services-ads:23.0.0"
          }
          """)

          open(f"{base}/AndroidManifest.xml", "w").write("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <application
                  android:allowBackup="true"
                  android:label="Shadow Vale: Ember Quest"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.No
