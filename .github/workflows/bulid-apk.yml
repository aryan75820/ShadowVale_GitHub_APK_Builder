name: Build Shadow Vale Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Project and Build APK
        run: |
          python3 -c '
          import os, glob, shutil

          base = "android_project/app/src/main"
          pkg_dir = f"{base}/java/com/pawarjigaming/shadowvale"
          os.makedirs(f"{base}/assets", exist_ok=True)
          os.makedirs(pkg_dir, exist_ok=True)

          htmls = [f for f in sorted(glob.glob("*.html") + glob.glob("*/*.html")) if not f.startswith("android_project")]
          if not htmls:
              raise RuntimeError("Repo mein koi .html file nahi mili!")
          print("Using HTML file:", htmls[0])
          shutil.copyfile(htmls[0], f"{base}/assets/index.html")

          open("android_project/settings.gradle", "w").write("""pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ShadowValeEmberQuest"
          include ":app"
          """)

          open("android_project/build.gradle", "w").write("""plugins {
              id "com.android.application" version "8.2.2" apply false
          }
          """)

          open("android_project/gradle.properties", "w").write("""org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """)

          open("android_project/app/build.gradle", "w").write("""plugins {
              id "com.android.application"
          }
          android {
              namespace "com.pawarjigaming.shadowvale"
              compileSdk 34
              defaultConfig {
                  applicationId "com.pawarjigaming.shadowvale"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.google.android.gms:play-services-ads:23.0.0"
          }
          """)

          open(f"{base}/AndroidManifest.xml", "w").write("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <application
                  android:allowBackup="true"
                  android:label="Shadow Vale: Ember Quest"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-8251220250880290~5084634199" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          open(f"{pkg_dir}/MainActivity.java", "w").write("""package com.pawarjigaming.shadowvale;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private AdView bannerAdView;
              private InterstitialAd mInterstitialAd;
              private RewardedAd mRewardedAd;
              private final String bannerUnitId = "ca-app-pub-8251220250880290/8023542749";
              private final String interstitialUnitId = "ca-app-pub-8251220250880290/9714319357";
              private final String rewardedUnitId = "ca-app-pub-8251220250880290/8215114432";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUI();

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new AdMobBridge(), "AndroidAdMob");
                  webView.loadUrl("file:///android_asset/index.html");
                  root.addView(webView, new FrameLayout.LayoutParams(-1, -1));

                  bannerAdView = new AdView(this);
                  bannerAdView.setAdSize(AdSize.BANNER);
                  bannerAdView.setAdUnitId(bannerUnitId);
                  FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-2, -2);
                  bp.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  root.addView(bannerAdView, bp);
                  setContentView(root);

                  MobileAds.initialize(this, status -> {
                      bannerAdView.loadAd(new AdRequest.Builder().build());
                      loadInterstitial();
                      loadRewarded();
                  });
              }

              private void loadInterstitial() {
                  InterstitialAd.load(this, interstitialUnitId, new AdRequest.Builder().build(),
                      new InterstitialAdLoadCallback() {
                          @Override public void onAdLoaded(@NonNull InterstitialAd ad) { mInterstitialAd = ad; }
                          @Override public void onAdFailedToLoad(@NonNull LoadAdError err) { mInterstitialAd = null; }
                      });
              }

              private void loadRewarded() {
                  RewardedAd.load(this, rewardedUnitId, new AdRequest.Builder().build(),
                      new RewardedAdLoadCallback() {
                          @Override public void onAdLoaded(@NonNull RewardedAd ad) { mRewardedAd = ad; }
                          @Override public void onAdFailedToLoad(@NonNull LoadAdError err) { mRewardedAd = null; }
                      });
              }

              public class AdMobBridge {
                  @JavascriptInterface
                  public void initialize(String bId, String iId, String rId) {}

                  @JavascriptInterface
                  public void setBannerVisible(boolean visible, String unitId) {
                      runOnUiThread(() -> {
                          if (bannerAdView != null) bannerAdView.setVisibility(visible ? View.VISIBLE : View.GONE);
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitial(String unitId) {
                      runOnUiThread(() -> {
                          if (mInterstitialAd != null) {
                              mInterstitialAd.setFullScreenContentCallback(new FullScreenContentCallback() {
                                  @Override public void onAdDismissedFullScreenContent() {
                                      mInterstitialAd = null;
                                      loadInterstitial();
                                      webView.evaluateJavascript("if(window.onAdMobInterstitialClosed) window.onAdMobInterstitialClosed();", null);
                                  }
                                  @Override public void onAdFailedToShowFullScreenContent(@NonNull AdError e) {
                                      mInterstitialAd = null;
                                      webView.evaluateJavascript("if(window.onAdMobInterstitialClosed) window.onAdMobInterstitialClosed();", null);
                                  }
                              });
                              mInterstitialAd.show(MainActivity.this);
                          } else {
                              loadInterstitial();
                              webView.evaluateJavascript("if(window.onAdMobInterstitialClosed) window.onAdMobInterstitialClosed();", null);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showRewarded(String unitId) {
                      runOnUiThread(() -> {
                          if (mRewardedAd != null) {
                              mRewardedAd.show(MainActivity.this, rewardItem -> {
                                  webView.evaluateJavascript("if(window.onAdMobRewardGranted) window.onAdMobRewardGranted();", null);
                              });
                              mRewardedAd = null;
                              loadRewarded();
                          } else {
                              loadRewarded();
                              webView.evaluateJavascript("if(window.onAdMobRewardGranted) window.onAdMobRewardGranted();", null);
                          }
                      });
                  }
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null) {
                      webView.evaluateJavascript("if(window.NavigationManager) window.NavigationManager.handleBackNavigation();", null);
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """)
          '
          cd android_project
          gradle assembleDebug --no-daemon

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVale-EmberQuest-APK
          path: android_project/app/build/outputs/apk/debug/*.apk
