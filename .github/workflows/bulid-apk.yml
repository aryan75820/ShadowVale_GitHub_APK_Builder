name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create Native Android Project
        run: |
          mkdir -p android_app/app/src/main/assets
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/java/com/pawarjigaming/shadowvale

          # Game HTML file copy
          if [ -f "ShadowVale-EmberQuest-Android-APK.zip" ]; then
            cp "ShadowVale-EmberQuest-Android-APK.zip" android_app/app/src/main/assets/index.html
          elif [ -f "index.html" ]; then
            cp "index.html" android_app/app/src/main/assets/index.html
          fi

          # Settings Gradle
          echo 'rootProject.name = "ShadowVale"' > android_app/settings.gradle
          echo "include ':app'" >> android_app/settings.gradle

          # Root build.gradle
          echo 'buildscript {' > android_app/build.gradle
          echo '    repositories {' >> android_app/build.gradle
          echo '        google()' >> android_app/build.gradle
          echo '        mavenCentral()' >> android_app/build.gradle
          echo '    }' >> android_app/build.gradle
          echo '    dependencies {' >> android_app/build.gradle
          echo "        classpath 'com.android.tools.build:gradle:8.2.2'" >> android_app/build.gradle
          echo '    }' >> android_app/build.gradle
          echo '}' >> android_app/build.gradle
          echo 'allprojects {' >> android_app/build.gradle
          echo '    repositories {' >> android_app/build.gradle
          echo '        google()' >> android_app/build.gradle
          echo '        mavenCentral()' >> android_app/build.gradle
          echo '    }' >> android_app/build.gradle
          echo '}' >> android_app/build.gradle

          # App build.gradle
          echo "plugins { id 'com.android.application' }" > android_app/app/build.gradle
          echo 'android {' >> android_app/app/build.gradle
          echo "    namespace 'com.pawarjigaming.shadowvale'" >> android_app/app/build.gradle
          echo '    compileSdk 34' >> android_app/app/build.gradle
          echo '    defaultConfig {' >> android_app/app/build.gradle
          echo "        applicationId 'com.pawarjigaming.shadowvale'" >> android_app/app/build.gradle
          echo '        minSdk 24' >> android_app/app/build.gradle
          echo '        targetSdk 34' >> android_app/app/build.gradle
          echo '        versionCode 1' >> android_app/app/build.gradle
          echo "        versionName '1.0'" >> android_app/app/build.gradle
          echo '    }' >> android_app/app/build.gradle
          echo '    buildTypes {' >> android_app/app/build.gradle
          echo '        release {' >> android_app/app/build.gradle
          echo '            minifyEnabled false' >> android_app/app/build.gradle
          echo '        }' >> android_app/app/build.gradle
          echo '    }' >> android_app/app/build.gradle
          echo '}' >> android_app/app/build.gradle
          echo 'dependencies {' >> android_app/app/build.gradle
          echo "    implementation 'androidx.appcompat:appcompat:1.6.1'" >> android_app/app/build.gradle
          echo "    implementation 'com.google.android.gms:play-services-ads:23.0.0'" >> android_app/app/build.gradle
          echo '}' >> android_app/app/build.gradle

          # App Name Strings
          echo '<resources>' > android_app/app/src/main/res/values/strings.xml
          echo '    <string name="app_name">Shadow Vale</string>' >> android_app/app/src/main/res/values/strings.xml
          echo '</resources>' >> android_app/app/src/main/res/values/strings.xml

          # AndroidManifest.xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > android_app/app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' >> android_app/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET" />' >> android_app/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' >> android_app/app/src/main/AndroidManifest.xml
          echo '    <application' >> android_app/app/src/main/AndroidManifest.xml
          echo '        android:allowBackup="true"' >> android_app/app/src/main/AndroidManifest.xml
          echo '        android:label="@string/app_name"' >> android_app/app/src/main/AndroidManifest.xml
          echo '        android:supportsRtl="true"' >> android_app/app/src/main/AndroidManifest.xml
          echo '        android:theme="@style/Theme.AppCompat.NoActionBar">' >> android_app/app/src/main/AndroidManifest.xml
          echo '        <meta-data' >> android_app/app/src/main/AndroidManifest.xml
          echo '            android:name="com.google.android.gms.ads.APPLICATION_ID"' >> android_app/app/src/main/AndroidManifest.xml
          echo '            android:value="ca-app-pub-8251220250880290~5084634199"/>' >> android_app/app/src/main/AndroidManifest.xml
          echo '        <activity' >> android_app/app/src/main/AndroidManifest.xml
          echo '            android:name=".MainActivity"' >> android_app/app/src/main/AndroidManifest.xml
          echo '            android:exported="true"' >> android_app/app/src/main/AndroidManifest.xml
          echo '            android:screenOrientation="sensorLandscape"' >> android_app/app/src/main/AndroidManifest.xml
          echo '            android:configChanges="orientation|screenSize|keyboardHidden">' >> android_app/app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> android_app/app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> android_app/app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> android_app/app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> android_app/app/src/main/AndroidManifest.xml
          echo '        </activity>' >> android_app/app/src/main/AndroidManifest.xml
          echo '    </application>' >> android_app/app/src/main/AndroidManifest.xml
          echo '</manifest>' >> android_app/app/src/main/AndroidManifest.xml

          # MainActivity.java
          cat << 'JAVA_CODE' > android_app/app/src/main/java/com/pawarjigaming/shadowvale/MainActivity.java
          package com.pawarjigaming.shadowvale;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.gms.ads.MobileAds;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  MobileAds.initialize(this, initializationStatus -> {});

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA_CODE

      - name: Build APK with System Gradle
        run: |
          cd android_app
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVale-EmberQuest-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
