name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Project
        run: |
          mkdir -p android_project/app/src/main/assets
          mkdir -p android_project/app/src/main/res/values
          mkdir -p android_project/app/src/main/java/com/pawarjigaming/shadowvale
          mkdir -p android_project/gradle/wrapper

          # Game file copy
          if [ -f "ShadowVale-EmberQuest-Android-APK.zip" ]; then
            cp "ShadowVale-EmberQuest-Android-APK.zip" android_project/app/src/main/assets/index.html
          elif [ -f "index.html" ]; then
            cp "index.html" android_project/app/src/main/assets/index.html
          fi

          # Gradle Wrapper Setup
          curl -sLo android_project/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          cat << 'EOF' > android_project/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat << 'EOF' > android_project/gradlew
          #!/bin/sh
          DIR=$(cd -P -- "$(dirname -- "$0")" && pwd -P)
          exec java -jar "$DIR/gradle/wrapper/gradle-wrapper.jar" "$@"
          EOF
          chmod +x android_project/gradlew

          # Project Configurations
          cat << 'EOF' > android_project/settings.gradle
          rootProject.name = "ShadowVale"
          include ':app'
          EOF

          cat << 'EOF' > android_project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > android_project/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.pawarjigaming.shadowvale'
              compileSdk 34
              defaultConfig {
                  applicationId "com.pawarjigaming.shadowvale"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
          }
          EOF

          cat << 'EOF' > android_project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Shadow Vale</string>
          </resources>
          EOF

          cat << 'EOF' > android_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-8251220250880290~5084634199"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_project/app/src/main/java/com/pawarjigaming/shadowvale/MainActivity.java
          package com.pawarjigaming.shadowvale;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.gms.ads.MobileAds;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  MobileAds.initialize(this, initializationStatus -> {});

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd android_project
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVale-EmberQuest-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
