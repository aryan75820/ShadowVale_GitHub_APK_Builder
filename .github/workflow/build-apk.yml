
name: Build Android APK (Pawar Ji Gaming)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 5. Sync Latest index.html into Android Assets
        run: |
          mkdir -p app/src/main/assets
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          fi

      - name: 6. Build Installable Android APK (with AdMob SDK)
        run: gradle assembleDebug --no-daemon

      - name: 7. Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVale-EmberQuest-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
