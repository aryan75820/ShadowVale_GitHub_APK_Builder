plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pawarjigaming.shadowvale'
    compileSdk 34

    defaultConfig {
        applicationId "com.pawarjigaming.shadowvale"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
